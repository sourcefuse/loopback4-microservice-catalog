name: Docs
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Bootstrap
        run: |
          npm ci --ignore-scripts
          npm run afterinstall
          npx lerna bootstrap
          npx lerna run build
      - name: Install mkdocs deps/plugins
        run: |
          pip install --only-binary :all: mkdocs-material==9.7.7
          pip install --only-binary :all: mkdocs-include-markdown-plugin==7.3.0
      - name: Create the docs directory locally in CI
        run: npm run export-typedocs
      - name: Deploy 🚀
        run: mkdocs gh-deploy --force
